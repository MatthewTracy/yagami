{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% set social_image = config.site_url ~ config.extra.social_image %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title if page and page.title else config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="{{ social_image }}">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="Yagami AI Context Firewall">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title if page and page.title else config.site_name }}">
  <meta name="twitter:description" content="{{ config.site_description }}">
  <meta name="twitter:image" content="{{ social_image }}">
{% endblock %}
