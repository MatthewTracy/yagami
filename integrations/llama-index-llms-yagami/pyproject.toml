[project]
name = "llama-index-llms-yagami"
version = "0.7.2"
description = "LlamaIndex LLM integration for the Yagami AI context firewall."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Matthew Tracy" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["llama-index-llms-openai-like>=0.7,<0.8"]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.urls]
Homepage = "https://github.com/MatthewTracy/yagami"
Documentation = "https://matthewtracy.github.io/yagami/integrations/"
Repository = "https://github.com/MatthewTracy/yagami/tree/main/integrations/llama-index-llms-yagami"
Issues = "https://github.com/MatthewTracy/yagami/issues"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]

