version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # MCP 2 removes FastMCP; retain maintained v1 until a tested migration.
      - dependency-name: mcp
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      vitest:
        patterns: [vitest, "@vitest/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codeql:
        # Init, analyze, and upload-sarif must use the same action version.
        patterns: [github/codeql-action/*]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
