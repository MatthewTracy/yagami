name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts evals integrations examples
      - name: Format check (ruff)
        run: ruff format --check src tests scripts evals integrations examples
      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: mypy src/yagami
      - name: Check release metadata
        run: python scripts/check_release.py
      - name: Validate MCP Registry metadata
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/validate_registry.py
      - name: Test default policy
        run: yagami policy test --policy config/policy.yaml --cases config/policy-tests.yaml
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: pytest -q
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        # The 0.7 trust/MCP/production surface establishes a measured 74% full
        # branch-coverage ratchet. Raise this floor as the staged APIs stabilize.
        run: pytest -q --cov=yagami --cov-report=term-missing
      - name: Verify installed dependencies
        run: pip check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build bundled control surface
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pip wheel . --no-deps --wheel-dir dist
      - name: Audit Python dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pip install pip-audit==2.10.1
          pip-audit --requirement requirements.container.lock

  ui:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  integrations:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and test Python adapters
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build==1.5.1 twine==6.2.0 ruff
          for package in \
            integrations/langchain-yagami \
            integrations/llama-index-llms-yagami \
            integrations/llama-index-embeddings-yagami; do
            python -m pip install -e "$package[test]"
            python -m pytest -q "$package/tests"
            python -m build "$package" --outdir "dist/$(basename "$package")"
          done
          python -m twine check --strict dist/*/*
          ruff check integrations
          ruff format --check integrations
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/ai-sdk-provider/package-lock.json
      - name: Build and test AI SDK provider
        working-directory: integrations/ai-sdk-provider
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          npm pack --dry-run

  postgres:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the PostgreSQL client bundled on ubuntu-latest so pg_dump can
        # exercise the real backup/restore path without a major-version skew.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yagami
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: yagami
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yagami -d yagami"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: test-only-password
      YAGAMI_DATABASE_URL: postgresql://yagami:test-only-password@127.0.0.1:5432/yagami
      YAGAMI_TEST_POSTGRES_URL: postgresql://yagami:test-only-password@127.0.0.1:5432/yagami
      YAGAMI_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,production]"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Migrate and test PostgreSQL
        run: |
          yagami db migrate
          pytest -q tests/test_migrations.py
          pytest -q tests/test_postgres_storage.py
          pytest -q tests/test_redis_coordination.py
      - name: Verify PostgreSQL backup and restore
        run: |
          yagami db backup --output /tmp/yagami.dump
          yagami db verify --format postgresql /tmp/yagami.dump
          createdb --host 127.0.0.1 --username yagami yagami_restore
          pg_restore --host 127.0.0.1 --username yagami \
            --dbname yagami_restore --no-owner --no-privileges /tmp/yagami.dump
          YAGAMI_TEST_POSTGRES_URL=postgresql://yagami:test-only-password@127.0.0.1:5432/yagami_restore \
            pytest -q tests/test_postgres_storage.py

  container:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: yagami:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true

  helm:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint Helm chart
        run: helm lint deploy/helm/yagami --strict
      - name: Render secure defaults
        run: helm template test deploy/helm/yagami > /dev/null
      - name: Render PostgreSQL multi-replica profile
        run: |
          helm template test deploy/helm/yagami \
            --set replicaCount=3 \
            --set database.existingSecret=yagami-postgresql \
            --set coordination.existingSecret=yagami-redis > /dev/null
