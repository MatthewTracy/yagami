site_name: Yagami — AI Context Firewall
site_description: Govern what context, models, and tools AI agents may use.
site_url: https://matthewtracy.github.io/yagami/
repo_url: https://github.com/MatthewTracy/yagami
repo_name: MatthewTracy/yagami
edit_uri: edit/main/docs/
exclude_docs: |
  internal/
theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra:
  social_image: assets/og.png
nav:
  - Start here: index.md
  - Security tour: tour.md
  - Gateway API: gateway.md
  - Policies: policies.md
  - Integrations: integrations.md
  - Comparison: comparison.md
  - Configuration: configuration.md
  - Knowledge base: knowledge-base.md
  - Deployment: deployment.md
  - Reliability and SLOs: slo.md
  - Development: development.md
  - Architecture: architecture.md
  - Compatibility: compatibility.md
  - Security:
      - Threat model: threat-model.md
      - Release integrity: releases.md
  - Evaluation: benchmarks.md
  - Design partners: design-partners.md
  - Roadmap: roadmap.md
