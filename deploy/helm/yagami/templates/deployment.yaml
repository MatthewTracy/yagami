{{- $multiReplica := or (gt (int .Values.replicaCount) 1) (and .Values.autoscaling.enabled (gt (int .Values.autoscaling.minReplicas) 1)) }}
{{- if and $multiReplica (not .Values.database.existingSecret) }}
{{- fail "A PostgreSQL database.existingSecret is required before scaling Yagami beyond one replica" }}
{{- end }}
{{- if and $multiReplica (not .Values.coordination.existingSecret) }}
{{- fail "A Redis coordination.existingSecret is required before scaling Yagami beyond one replica" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yagami.fullname" . }}
  labels:
    {{- include "yagami.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "yagami.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "yagami.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "yagami.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: yagami
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "yagami.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HOME
              value: /data
            - name: YAGAMI_HEADLESS
              value: "true"
            - name: YAGAMI_REQUIRE_AUTH
              value: "true"
            - name: YAGAMI_CONFIG_PATH
              value: /app/config/yagami.toml
            - name: YAGAMI_POLICY_PATH
              value: /app/config/policy.yaml
            - name: YAGAMI_PROJECTS_PATH
              value: /app/config/projects.yaml
            - name: YAGAMI_DB_PATH
              value: /data/yagami.db
            {{- if .Values.database.existingSecret }}
            - name: YAGAMI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            {{- end }}
            - name: YAGAMI_COORDINATION_PREFIX
              value: {{ .Values.coordination.prefix | quote }}
            - name: YAGAMI_COORDINATION_SLOT_TTL_SECONDS
              value: {{ .Values.coordination.slotTtlSeconds | quote }}
            - name: YAGAMI_REMOTE_ADMIN_ENABLED
              value: {{ .Values.remoteAdmin.enabled | quote }}
            - name: YAGAMI_ADMIN_ALLOWED_ORIGINS
              value: {{ join "," .Values.remoteAdmin.allowedOrigins | quote }}
            - name: YAGAMI_OIDC_ISSUER
              value: {{ .Values.remoteAdmin.oidc.issuer | quote }}
            - name: YAGAMI_OIDC_AUDIENCE
              value: {{ .Values.remoteAdmin.oidc.audience | quote }}
            - name: YAGAMI_OIDC_JWKS_URL
              value: {{ .Values.remoteAdmin.oidc.jwksUrl | quote }}
            - name: YAGAMI_METRICS_ENABLED
              value: {{ .Values.observability.metricsEnabled | quote }}
            {{- if .Values.coordination.existingSecret }}
            - name: YAGAMI_COORDINATION_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.coordination.existingSecret | quote }}
                  key: {{ .Values.coordination.secretKey | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ required "apiKeysExistingSecret is required" .Values.apiKeysExistingSecret }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "yagami.fullname" . }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "yagami.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
