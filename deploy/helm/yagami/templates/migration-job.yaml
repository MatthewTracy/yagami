{{- if and .Values.database.existingSecret .Values.database.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "yagami.fullname" . }}-migrate
  labels:
    {{- include "yagami.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.database.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "yagami.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "yagami.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["yagami", "db", "migrate"]
          env:
            - name: HOME
              value: /tmp
            - name: YAGAMI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.secretKey | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
